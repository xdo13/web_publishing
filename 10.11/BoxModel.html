<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        p{
            background-color: rgb(192, 216, 58);
            width: 300px;
            padding: 1cm;
            border: 15px solid aquamarine;
            margin: 80px;
            
           }
        div{
            background-color: yellow;
            width: 300px;
            padding: 25px;
            border: 15px solid navy;
            margin: 25px;
        }
    </style>

    <meta charset="UTF-8">
    <title>박스모델</title>
</head>
<body>
    <p>CSS3 박스 모델은 content, padding, border, margin으로 구성되어 있다.</p>
    <div>박스 모델의 padding, border, margin 속성의 기본 값은 0이며, 상하좌우 네 가지 방향을 top, bottom, left, right을 이용하여 저장 할 수 있습니다</div>
    
</body>
</html>
