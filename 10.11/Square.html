<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>둥근 사각형</title>
    <style>
        .rounded-square {
            width: 200px;
            height: 200px;
            background-color: rgba(76, 175, 80, 0.5); /* 반투명 배경색 */
            border-radius: 50px;
            border: 4px solid #4CAF50; /* 외부 테두리 색상 및 두께 */
            box-shadow: inset 0 0 0 2px #FFD700; /* 내부 테두리 색상 */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px; /* 글자 크기 */
            text-align: center;
            position: relative; /* 이중선을 위해 relative 설정 */
        }

        .rounded-square a {
            color: white; /* 글자 색상 */
            text-decoration: none; /* 기본 링크 스타일 제거 */
            text-shadow: 1px 1px 0px #000, /* 글자 테두리 */
                         -1px -1px 0px #000,
                         1px -1px 0px #000,
                         -1px 1px 0px #000;
            position: relative; /* 이중선을 위해 relative 설정 */
        }

        .rounded-square a::after {
            content: '';
            display: block;
            width: 100%;
            height: 2px; /* 이중선 두께 */
            background-color: #ff0000; /* 이중선 색상 */
            position: absolute;
            bottom: -5px; /* 글자 아래 위치 */
            left: 0;
            border-bottom: 2px solid #0c1daf; /* 이중선 */
            z-index: -1; /* 글자 뒤에 위치 */
        }
    </style>
</head>
<body>
    <div class="rounded-square">
        <a href="https://chat.openai.com" target="_blank">두드림컴퓨터학원</a>
    </div>
</body>
</html>
